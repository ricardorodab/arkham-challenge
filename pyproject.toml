[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "outage-explorer"
version = "0.4.0"
description = "A secure, accessible nuclear outage exploration application"
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.0", "Django==6.1.3", "sqlglot==30.29.0", "waitress==3.0.2"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pytest-django==4.14.0"]

[project.scripts]
outage-explorer = "outage_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outage_explorer = ["analytics/sql/*.sql", "analytics/contracts/*.json", "sandbox/*", "service/*.json", "frontend/templates/outage_explorer/*.html", "frontend/static/outage_explorer/*", "frontend/locale/*/LC_MESSAGES/*.mo", "frontend/locales/es/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "tests.django_settings"
django_find_project = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
