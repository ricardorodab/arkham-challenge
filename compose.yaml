x-runtime: &runtime
  image: ${OUTAGE_IMAGE:-arkham:local}
  build:
    context: .
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  volumes:
    - data:/appdata/data
    - state:/appdata/state

services:
  init:
    <<: *runtime
    command: ["python", "-m", "outage_explorer.web.local", "init"]
    restart: "no"

  app:
    <<: *runtime
    mem_limit: 2g
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OUTAGE_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *runtime
    mem_limit: 2g
    profiles: ["worker"]
    command: ["python", "-m", "outage_explorer.web.local", "worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      EIA_API_KEY: "${EIA_API_KEY:-}"
    restart: unless-stopped

volumes:
  data:
  state:
