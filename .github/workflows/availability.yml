name: Public HTTPS availability

on:
  schedule:
    # Offset from the busy start of each hour. GitHub schedules are best effort.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  health:
    name: Public HTTPS liveness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check public TLS and process liveness
        run: python deploy/check-health.py
        env:
          OUTAGE_PUBLIC_HOST: ${{ vars.OUTAGE_PUBLIC_HOST }}
