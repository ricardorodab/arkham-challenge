name: Data, backend and browser checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests
      - run: python -m pytest -q
        env:
          EIA_API_KEY: ''
      - run: python -m pip check
      - name: Install browser for Windows acceptance
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: npx playwright install chromium
      - name: Exercise the browser against the isolated synthetic service
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $env:OUTAGE_TEST_PYTHON = (Get-Command python).Source
          npm run test:browser

  container:
    name: Docker build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build the pinned production image
        run: docker build --pull --tag arkham:ci .
      - name: Verify private files are excluded from the build context
        run: python tests/docker/context_privacy.py --image arkham:ci
      - name: Exercise isolated containers through host HTTP
        run: python tests/docker/acceptance.py --image arkham:ci
