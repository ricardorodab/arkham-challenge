name: Data, backend and browser checks

on:
  push:
  pull_request:
  schedule:
    - cron: '23 12 * * 1'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:editor
      - run: npm run test:unit
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests
      - name: Install age for real backup encryption and restore tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes age
      - run: python -m pytest -q
        env:
          EIA_API_KEY: ''
      - run: python -m pip check
      - name: Install browser for Windows acceptance
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: npx playwright install chromium
      - name: Exercise the browser against the isolated synthetic service
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: |
          $env:OUTAGE_TEST_PYTHON = (Get-Command python).Source
          npm run test:browser

  container:
    name: Docker build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_id: ${{ steps.identity.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build the pinned production image
        run: >-
          docker build --pull
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --tag arkham:ci .
      - name: Verify private files are excluded from the build context
        run: python tests/docker/context_privacy.py --image arkham:ci
      - name: Report all high and critical production-image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arkham:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: table
          timeout: 10m
      - name: Block production-image vulnerabilities with available fixes
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arkham:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
      - name: Exercise isolated containers through host HTTP
        run: python tests/docker/acceptance.py --image arkham:ci
      - name: Verify production secret files and restart recovery
        run: python tests/docker/production_secrets.py --image arkham:ci
      - name: Record the exact accepted image identity
        id: identity
        shell: bash
        run: printf 'image_id=%s\n' "$(docker image inspect --format '{{.Id}}' arkham:ci)" >> "$GITHUB_OUTPUT"
      - name: Export the accepted image for trusted main promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/arkham-image.tar" arkham:ci
      - name: Retain the accepted image for this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-image-${{ github.sha }}
          path: ${{ runner.temp }}/arkham-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  dependency_audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Include pinned build dependencies in the audit
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          output = Path(os.environ['RUNNER_TEMP']) / 'requirements-build.txt'
          output.write_text('\n'.join(project['build-system']['requires']) + '\n', encoding='utf-8')
          PY
      - name: Audit exact runtime, development and build dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt ${{ runner.temp }}/requirements-build.txt
          no-deps: true
          disable-pip: true
      - name: Audit the npm lockfile without running package scripts
        run: npm audit --package-lock-only --audit-level=high

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history with fully redacted results
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'

  security:
    name: Security checks
    if: always()
    needs: [dependency_audit, secret_scan, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every security scan to succeed
        env:
          DEPENDENCIES_RESULT: ${{ needs.dependency_audit.result }}
          SECRETS_RESULT: ${{ needs.secret_scan.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for result in "$DEPENDENCIES_RESULT" "$SECRETS_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != success ]]; then
              echo 'A required security check failed, was cancelled, or was skipped.' >&2
              exit 1
            fi
          done

  publish:
    name: Publish the accepted main image
    needs: [container, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Retrieve this run's accepted image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: accepted-image-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Import and verify the tested image without rebuilding
        env:
          ACCEPTED_IMAGE_ID: ${{ needs.container.outputs.image_id }}
        run: |
          docker load --input "$RUNNER_TEMP/arkham-image.tar"
          [[ "$(docker image inspect --format '{{.Id}}' arkham:ci)" == "$ACCEPTED_IMAGE_ID" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' arkham:ci)" == "$GITHUB_SHA" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' arkham:ci)" == "https://github.com/$GITHUB_REPOSITORY" ]]
      - name: Publish the accepted image without rebuilding
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-vm"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/arkham-registry.XXXXXXXX")
          trap 'rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker tag arkham:ci "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_SHA")
          [[ "$reference" =~ ^${image}@sha256:[0-9a-f]{64}$ ]]
          OUTAGE_IMAGE="$reference" python deploy/verify-package.py
          unset GHCR_TOKEN
          printf 'image=%s\n' "$reference" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy the accepted digest to Azure VM
    needs: [test, security, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: arkham-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip a release superseded on main
        id: current
        shell: bash
        run: |
          set -Eeuo pipefail
          latest=$(git ls-remote origin refs/heads/main)
          latest=${latest%%$'\t'*}
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipped deployment: this commit was superseded on main.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.current.outputs.current == 'true'
        with:
          python-version: '3.14'
      # OIDC uses the main-branch ref subject configured on the Azure identity.
      - name: Sign in to Azure with GitHub OIDC
        if: steps.current.outputs.current == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply the immutable release and verify public HTTPS
        if: steps.current.outputs.current == 'true'
        run: python deploy/invoke-managed-run-command.py
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
          OUTAGE_PUBLIC_HOST: ${{ vars.OUTAGE_PUBLIC_HOST }}
          OUTAGE_IMAGE: ${{ needs.publish.outputs.image }}
